name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    environment: npm-release

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
          # Do not set registry-url: setup-node would write an empty
          # _authToken entry that prevents npm from initiating its OIDC flow.

      - name: Setup npm
        run: npm install --global npm@12.0.2

      - name: Verify npm Trusted Publishing prerequisites
        run: |
          node --version
          npm --version
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Verify packed @stlw/warden consumer
        run: npm run verify:core-package

      - name: Verify package READMEs
        run: npm run verify:package-readmes

      # ── Build in dependency order ──────────────────────────────────

      - name: Build @stlw/warden
        run: cd packages/core && npx tsc && cd ../..

      - name: Build @stlw/warden-hook-server
        run: cd packages/hook-server && npx tsc && cd ../..

      - name: Build @stlw/warden-mcp-gateway
        run: cd packages/mcp-gateway && npx tsc && cd ../..

      - name: Build @stlw/warden-cli
        run: cd packages/cli && npx tsc && cd ../..

      # ── Publish in dependency order ────────────────────────────────
      # npm Trusted Publishing exchanges this job's OIDC identity for a
      # short-lived publish credential. Do not add an NPM_TOKEN here.

      - name: Publish @stlw/warden
        run: npm publish --provenance --access public
        working-directory: packages/core

      - name: Publish @stlw/warden-hook-server
        run: npm publish --provenance --access public
        working-directory: packages/hook-server

      - name: Publish @stlw/warden-mcp-gateway
        run: npm publish --provenance --access public
        working-directory: packages/mcp-gateway

      - name: Publish @stlw/warden-cli
        run: npm publish --provenance --access public
        working-directory: packages/cli

  docker:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
