services:
  warden:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warden-hook-server
    ports:
      - "7429:7429"
    volumes:
      # Mount config as read-only — create warden.config.yml first with 'warden init'
      - ./warden.config.yml:/app/warden.config.yml:ro
      # Persist ledger database and vault secrets
      - ./.warden:/app/.warden
    environment:
      - NODE_ENV=development
      # Recommended: require a shared secret on /hooks/* (see .env.example)
      # - WARDEN_AUTH_TOKEN=${WARDEN_AUTH_TOKEN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:7429/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
